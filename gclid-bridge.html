<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cxuan</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;background:#f5f7fa;color:#333}
.box{text-align:center;padding:24px}
.spinner{width:48px;height:48px;border:4px solid #e0e7ee;border-top-color:#1FA8B5;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
.msg{font-size:14px;color:#666}
.err{color:#d93025;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<div class="spinner"></div>
<div class="msg">正在為您開啟 LINE…</div>
<div id="err" class="err"></div>
</div>
<script>
(function(){
  var LIFF_ID = '2009990533-sifaip1q';
  var MAKE_WEBHOOK = 'https://hook.us2.make.com/6xirl5btuyoar4a6vggigmp3ptu92r0a';
  var DEFAULT_OA_ID = '@260ujymt';

  var errBox = document.getElementById('err');
  function showErr(msg){ errBox.textContent = msg; }

  // Parse query params
  var params = new URLSearchParams(location.search);
  var gclid = params.get('gclid') || params.get('gbraid') || params.get('wbraid') || '';
  var gad_source = params.get('gad_source') || '';
  var gad_campaignid = params.get('gad_campaignid') || '';
  // Store-specific OA ID（GTM Tag inject 帶上 store=@xxx）
  var storeOa = params.get('store') || DEFAULT_OA_ID;
  if (storeOa.indexOf('@') !== 0) storeOa = '@' + storeOa;

  function doRedirect(){
    if (liff.isInClient()) {
      liff.openWindow({ url: 'https://line.me/R/ti/p/' + storeOa, external: false });
      liff.closeWindow();
    } else {
      location.href = 'https://line.me/R/ti/p/' + storeOa;
    }
  }

  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      return liff.getProfile();
    })
    .then(function(profile){
      if (!profile) return;
      var payload = {
        lineUserId: profile.userId,
        lineDisplayName: profile.displayName || '',
        gclid: gclid,
        gad_source: gad_source,
        gad_campaignid: gad_campaignid,
        storeOa: storeOa,
        capturedAt: new Date().toISOString(),
        source: 'liff_gclid_bridge_v2',
        referrer: document.referrer || ''
      };
      try {
        var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        navigator.sendBeacon(MAKE_WEBHOOK, blob);
      } catch(e) {
        fetch(MAKE_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(function(){});
      }
      setTimeout(doRedirect, 400);
    })
    .catch(function(err){
      console.error('LIFF init/profile error:', err);
      showErr('開啟失敗，導向 LINE…');
      setTimeout(doRedirect, 2000);
    });
})();
</script>
</body>
</html>

// ===== 即時價格：與「分店叫貨 LIFF」讀同一個定價庫 API（E 欄分店批發、H 欄終端售價）=====
// 開啟時先用快取（或內建快照）立刻顯示，再向定價庫抓最新價格換上；抓不到就留在舊資料並標示。
const PRODUCTS_API = 'https://script.google.com/macros/s/AKfycbyYJo8-02TMACwfk7mnOC5sJvBCwH02Tb1TP6CJJed-8FwDx0Id9UArzQKYk2E5zbg7gA/exec?action=products';
const CACHE_KEY = 'cxuan_catalog_live_v1';
const FETCH_TIMEOUT_MS = 30000;
const RESYNC_AFTER_MS = 10 * 60 * 1000; // App 從背景回到前景超過 10 分鐘就再同步一次
// 2026-10-18 老闆裁示：3M／舒萬諾合作未成立、無法直接向舒萬諾進貨，App 比照叫貨 LIFF 隱藏該供應線。
// 只擋主供應商（F 欄第一段）為 3M／舒萬諾的商品；盛智_3m商用、家享 3m 零件照常顯示。
const RETIRED_SOLVENTUM_VENDORS = new Set(['3m', '3m舒萬諾', '舒萬諾', '台灣舒萬諾股份有限公司', 'solventum']);
function isRetiredVendor(v) {
  const primary = String(v || '').split('/')[0].trim().replace(/\s+/g, '').toLowerCase();
  return RETIRED_SOLVENTUM_VENDORS.has(primary);
}

const filtersEl = document.getElementById("filters");
const listEl    = document.getElementById("list");
const statsEl   = document.getElementById("stats");
const searchEl  = document.getElementById("search");
const modalEl   = document.getElementById("modal");
const modalImg  = document.getElementById("modalImg");
const syncEl    = document.getElementById("sync");

const SEED_VISIBLE = SEED.filter(p => !isRetiredVendor(p.v));  // 內建快照也套同一條隱藏規則
let P = SEED_VISIBLE;  // 目前畫面上的商品清單
let activeVendor = "";
let liveLoading = false;
let lastSyncTs = 0;

// 內建快照：依 cx 碼保留圖片／官網連結，並記住廠商顯示順序
const seedByCx = {};
const seedVendorOrder = [];
SEED.forEach(p => {
  const m = /^(cx\d+)_/.exec(p.n);
  if (m) seedByCx[m[1]] = p;
  if (!seedVendorOrder.includes(p.v)) seedVendorOrder.push(p.v);
});

function cleanVendor(v) {
  // 定價庫 F 欄像「葦翔/澄軒客服/中部倉管」，只取第一段當廠商名
  return String(v || '').split('/')[0].trim() || '未分類';
}

// 把定價庫 API 的列（cx / name / vendor / cost / retail）轉成目錄格式
function toCatalog(items) {
  const out = [];
  items.forEach(it => {
    if (!it || !it.cx) return;
    if (isRetiredVendor(it.vendor)) return;   // 3M／舒萬諾：與叫貨 LIFF 同樣不顯示
    const s = Number(it.cost) || 0, r = Number(it.retail) || 0;
    if (!s && !r) return;                       // 兩個價都沒有的列不顯示
    const seed = seedByCx[it.cx];
    const p = { n: `${it.cx}_${String(it.name || '').trim()}`, s, r, v: cleanVendor(it.vendor) };
    if (seed && seed.i) p.i = seed.i;
    if (seed && seed.u) p.u = seed.u;
    out.push(p);
  });
  // 廠商順序：先照內建快照原本的順序，新廠商依商品數排在後面；同廠商內維持定價庫列序
  const counts = {};
  out.forEach(p => counts[p.v] = (counts[p.v] || 0) + 1);
  const order = seedVendorOrder.filter(v => counts[v])
    .concat(Object.keys(counts).filter(v => !seedVendorOrder.includes(v)).sort((a, b) => counts[b] - counts[a]));
  const rank = {}; order.forEach((v, k) => rank[v] = k);
  return out.map((p, k) => [p, k]).sort((a, b) => (rank[a[0].v] - rank[b[0].v]) || (a[1] - b[1])).map(x => x[0]);
}

function buildChips() {
  const counts = {};
  P.forEach(p => counts[p.v] = (counts[p.v] || 0) + 1);
  const vendors = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (activeVendor && !counts[activeVendor]) activeVendor = "";
  let chipHtml = `<button type="button" class="chip${activeVendor ? '' : ' active'}" data-v="">全部 (${P.length})</button>`;
  vendors.forEach(v => {
    chipHtml += `<button type="button" class="chip${activeVendor === v ? ' active' : ''}" data-v="${escapeHtml(v)}">${escapeHtml(v)} (${counts[v]})</button>`;
  });
  filtersEl.innerHTML = chipHtml;
}

function setProducts(list) { P = list; buildChips(); render(); }

function fmtTime(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function setSync(text, cls) { syncEl.textContent = text; syncEl.className = 'sync' + (cls ? ' ' + cls : ''); }

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (c && Array.isArray(c.items) && c.items.length) ? c : null;
  } catch (e) { return null; }
}
function writeCache(items, updatedAt) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), updatedAt: updatedAt || null, items })); } catch (e) {}
}

async function fetchLive() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(`${PRODUCTS_API}&_=${Date.now()}`, { redirect: 'follow', cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const items = Array.isArray(data) ? data : (data && data.products) || [];
    if (!items.length) throw new Error('empty');
    return { items, updatedAt: data.updatedAt || null };
  } finally { clearTimeout(timer); }
}

async function loadLive() {
  if (liveLoading) return;
  liveLoading = true;
  setSync('⟳ 正在從定價庫更新價格…');
  try {
    const { items, updatedAt } = await fetchLive();
    const list = toCatalog(items);
    if (!list.length) throw new Error('no usable rows');
    writeCache(items, updatedAt);
    lastSyncTs = Date.now();
    setProducts(list);
    setSync(`✓ 價格已同步定價庫（${fmtTime(lastSyncTs)}，共 ${list.length} 項，與叫貨 LIFF 相同）`, 'ok');
  } catch (e) {
    const c = readCache();
    if (c) setSync(`⚠ 連不上定價庫，顯示 ${fmtTime(c.ts)} 同步的價格。點這裡重試`, 'warn');
    else setSync('⚠ 連不上定價庫，顯示內建的舊價格（可能已過期）。點這裡重試', 'warn');
  } finally { liveLoading = false; }
}

function boot() {
  const c = readCache();
  if (c) {
    const list = toCatalog(c.items);
    if (list.length) { lastSyncTs = c.ts || 0; setProducts(list); }
    else setProducts(SEED_VISIBLE);
  } else {
    setProducts(SEED_VISIBLE);
  }
  loadLive();
}

syncEl.addEventListener('click', () => loadLive());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastSyncTs > RESYNC_AFTER_MS) loadLive();
});

filtersEl.addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  activeVendor = btn.dataset.v;
  btn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  render();
});

searchEl.addEventListener("input", () => render());

function searchUrl(query, type) {
  const q = encodeURIComponent(query);
  if (type === 'image') return `https://www.google.com/search?q=${q}&tbm=isch`;
  return `https://www.google.com/search?q=${q}`;
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function render() {
  const q = searchEl.value.trim().toLowerCase();
  let filtered = P;
  if (activeVendor) filtered = filtered.filter(p => p.v === activeVendor);
  if (q) {
    const terms = q.split(/\s+/);
    filtered = filtered.filter(p => {
      const text = (p.n + " " + p.v).toLowerCase();
      return terms.every(t => text.includes(t));
    });
  }
  statsEl.textContent = `顯示 ${filtered.length} / ${P.length} 項商品`;

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>找不到符合的商品<br>試試其他關鍵字</div>';
    return;
  }

  let html = "";
  let lastVendor = "";
  filtered.forEach(p => {
    if (!q && !activeVendor && p.v !== lastVendor) {
      lastVendor = p.v;
      html += `<div class="vendor-header">${escapeHtml(p.v)}</div>`;
    }
    const query = `${p.v} ${p.n}`;
    const thumbInner = p.i 
      ? `<img src="${escapeHtml(p.i)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.style.background='#f0f2f5'">` 
      : '';
    const thumbAttr = p.i ? `data-img="${escapeHtml(p.i)}"` : '';
    html += `<div class="card">
      <div class="card-top">
        <div class="card-thumb" ${thumbAttr}>${thumbInner}</div>
        <div class="card-info">
          <div class="card-left">
            <div class="card-name">${escapeHtml(p.n)}</div>
            <div class="card-vendor">${escapeHtml(p.v)}</div>
          </div>
          <div class="card-right">
            <div class="price-label">分店批發</div>
            <div class="price-store">${p.s ? p.s.toLocaleString() : '-'}</div>
            <div class="price-label" style="margin-top:4px">終端售價</div>
            <div class="price-retail">${p.r ? p.r.toLocaleString() : '-'}</div>
          </div>
        </div>
      </div>
      <div class="actions">
        ${p.u ? `<a class="action" href="${escapeHtml(p.u)}" target="_blank" rel="noopener"><span class="action-emoji">🌐</span>官網</a>` : ''}
        <a class="action" href="${searchUrl(query, '')}" target="_blank" rel="noopener"><span class="action-emoji">🔍</span>Google</a>
        <a class="action" href="${searchUrl(query, 'image')}" target="_blank" rel="noopener"><span class="action-emoji">📷</span>圖片</a>
      </div>
    </div>`;
  });
  listEl.innerHTML = html;
}

// Image modal
listEl.addEventListener('click', e => {
  const thumb = e.target.closest('.card-thumb[data-img]');
  if (!thumb) return;
  modalImg.src = thumb.dataset.img;
  modalEl.classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', () => modalEl.classList.remove('show'));
modalEl.addEventListener('click', e => { if (e.target === modalEl) modalEl.classList.remove('show'); });

boot();

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
});

const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (iOS && !isStandalone && !sessionStorage.getItem('iosHintShown')) {
  setTimeout(() => {
    sessionStorage.setItem('iosHintShown', '1');
    const banner = document.getElementById('installBanner');
    banner.innerHTML = '<span>📲 點擊 ⬆️ 分享 → <b>加入主畫面</b> 即可變 App</span>';
    banner.style.display = 'flex';
    banner.onclick = () => banner.style.display = 'none';
  }, 1500);
}
</script>
</body>
</html>
